# Bundle patch for dsh-wisp.
#
# A profile points at this file through its own `dsh.bundle.patch` field; the
# loader reads it as a top-level YAML array of patch entries, exactly like the
# shipped bundles do.
#
# THE ROW BELOW POINTS AT THE HOST HALF — `dsh-wisp`, not `dsh-wisp/client`.
#
# This distinction is the whole reason the plugin failed to load three times.
# The loader imports this name as an ES module. `dsh-wisp` resolves to
# lib/index.js, which is a valid ES module. `dsh-wisp/client` resolves to
# lib/client.js, which is a classic browser script beginning with
# `window.__ModuleLoader__.load(...)` — the host cannot import that, so
# `entry.fiber` stayed undefined and @deepseek-ai/dsh-app-boot reported its
# terse `"failed to import"`.
#
# The browser half still ships: it is discovered through package.json
# `exports["./client"]` (dsh-client-modules reads that, it does not import it)
# and delivered to the page by the /plugins bundle route.
#
# Config keys the client half accepts: the FULL list (with types, defaults and
# clamps) lives in README.md's 「配置」 table — it is the single documented source,
# and the preflight fails if a key in CONFIG_SPEC is missing from it. Keeping a
# second copy here is how this file drifted before (a key was added to the README
# table and not to this comment).
#
# The four you are most likely to want:
#   right             distance from the right edge in px     (默认 26)
#   bottom            distance from the bottom edge in px    (默认 46)
#   size              render scale, 0.4–8                    (默认 4 → 560x840 CSS px)
#   motion            'full' | 'subtle' | 'off'              (默认 'full')
#
# 更新检查的两个源也可以换（宿主半包读 config.urls）—— 国内镜像：
#   urls:
#     npm: "https://registry.npmmirror.com/dsh-wisp/latest"
# 没给的源仍用内置默认值；只给 npm 一个键也是合法的。
#
# 菜单里的「看看余额」**不需要任何配置或 API key**：余额由平台自己的账户服务
# 提供（宿主半包的 optional inject: deepseekAccount），凭据留在平台手里。
#
# Example — add a `config:` block to the row below:
#
#   - insert:
#       - id: wisp
#         name: "dsh-wisp"
#         config:
#           bottom: 90
#           size: 1.2
#           chatterMs: 300000

- insert:
    - id: wisp
      name: "dsh-wisp"
